<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NoobV2 Parkour Tower</title></head><body><main id="app"><header><div><strong>NOOBV2 <span>PARKOUR TOWER</span></strong><small id="identity">Loading game…</small></div><div class="stats"><div>STAGE <b id="stage">1 / 10</b></div><div>TIME <b id="time">0.00s</b></div><div>DEATHS <b id="deaths">0</b></div></div></header><div class="gamebox"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Parkour platform game"></canvas><div id="overlay" class="overlay"><h1>NOOBV2 PARKOUR</h1><p>Run, jump, dodge spikes, touch checkpoints and reach the flag!</p><button id="play">PLAY NOW</button></div></div><footer><div><span>A / D or ← / → Move</span><span>Space / W / ↑ Jump</span><span>R Restart</span></div><div><button id="restart">Restart</button><button id="levels">Stages</button><button id="leaderboard">Leaderboard</button></div></footer><div id="touch"><button data-key="left">◀</button><button data-key="jump">JUMP</button><button data-key="right">▶</button></div><section id="panel" hidden></section></main><script type="module" src="/src/main.js"></script></body></html>
